services:

  temperature-api-1:
    build:
      context: ./src/TemperatureService.Api
      dockerfile: Dockerfile

    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Redis__ConnectionString=redis:6379
      - WeatherApi__BaseUrl=http://host.docker.internal:5185/api/weather/
      - WeatherApi__Token=weather-mock-secret-token

    ports:
      - "8081:8080"

    depends_on:
      - redis

  temperature-api-2:
    build:
      context: ./src/TemperatureService.Api
      dockerfile: Dockerfile

    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Redis__ConnectionString=redis:6379
      - WeatherApi__BaseUrl=http://host.docker.internal:5185/api/weather/
      - WeatherApi__Token=weather-mock-secret-token

    ports:
      - "8082:8080"

    depends_on:
      - redis

  redis:
    image: redis:latest

    ports:
      - "6379:6379"